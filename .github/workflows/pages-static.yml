name: Deploy static design to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build demo app
        run: dotnet build src/LFPortal.Web/LFPortal.Web.csproj --configuration Release

      - name: Generate complete English and Arabic static demo
        shell: bash
        run: |
          set -euo pipefail

          ASPNETCORE_ENVIRONMENT=Production \
            dotnet run \
              --project src/LFPortal.Web/LFPortal.Web.csproj \
              --configuration Release \
              --no-build \
              --no-launch-profile \
              --urls 'http://127.0.0.1:5055' > app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          ready=0
          for i in {1..40}; do
            if curl -fsS 'http://127.0.0.1:5055/health' > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1

          curl -fsS -c en.cookies \
            'http://127.0.0.1:5055/SetCulture?culture=en&returnUrl=%2FDashboard' \
            -o /dev/null
          curl -fsS -c ar.cookies \
            'http://127.0.0.1:5055/SetCulture?culture=ar&returnUrl=%2FDashboard' \
            -o /dev/null

          snapshot() {
            local out="$1"
            local cookie="$2"

            mkdir -p \
              "$out/Dashboard/Probe" \
              "$out/Archive/Detail" \
              "$out/Settings/saved"

            curl -fsS -b "$cookie" 'http://127.0.0.1:5055/Dashboard' \
              -o "$out/index.html"
            curl -fsS -b "$cookie" 'http://127.0.0.1:5055/Archive' \
              -o "$out/Archive/index.html"
            curl -fsS -b "$cookie" 'http://127.0.0.1:5055/Dashboard/Probe' \
              -o "$out/Dashboard/Probe/index.html"

            # Keep the antiforgery cookie emitted by the Settings page so the
            # existing demo-safe POST actions can be snapshotted too.
            curl -fsS -b "$cookie" -c "$cookie" 'http://127.0.0.1:5055/Settings' \
              -o "$out/Settings/index.html"
            curl -fsS -b "$cookie" 'http://127.0.0.1:5055/Settings?saved=true' \
              -o "$out/Settings/saved/index.html"

            for id in 100 101 102 103 104 105 106 107; do
              mkdir -p "$out/Archive/folder-$id"
              curl -fsS -b "$cookie" \
                "http://127.0.0.1:5055/Archive?entryId=$id&trail=1%3ARepository" \
                -o "$out/Archive/folder-$id/index.html"
            done
          }

          snapshot '_site' 'en.cookies'
          snapshot '_site/ar' 'ar.cookies'

          # Preserve the existing Archive detail-panel behavior exactly: every
          # document shown by the mock archive gets its own static partial. The
          # browser will fetch the matching partial by entry ID instead of calling
          # ASP.NET at runtime.
          DOC_IDS=$(grep -RhoE 'data-entry-id="[0-9]+"' \
            _site/Archive/index.html _site/Archive/folder-*/index.html \
            | grep -oE '[0-9]+' | sort -nu | tr '\n' ' ')
          test -n "$DOC_IDS"

          for id in $DOC_IDS; do
            curl -fsS -b en.cookies \
              "http://127.0.0.1:5055/Archive/Detail?entryId=$id" \
              -o "_site/Archive/Detail/$id.html"
            curl -fsS -b ar.cookies \
              "http://127.0.0.1:5055/Archive/Detail?entryId=$id" \
              -o "_site/ar/Archive/Detail/$id.html"
          done

          # Snapshot the two existing Settings AJAX actions. They are already
          # intercepted by DemoSettingsActionFilter and make no real network calls.
          extract_token() {
            python3 - "$1" <<'PY'
          import html
          import re
          import sys
          text = open(sys.argv[1], encoding='utf-8').read()
          match = re.search(r'name="__RequestVerificationToken"[^>]*value="([^"]+)"', text)
          if not match:
              raise SystemExit('Antiforgery token not found')
          print(html.unescape(match.group(1)))
          PY
          }

          EN_TOKEN=$(extract_token _site/Settings/index.html)
          AR_TOKEN=$(extract_token _site/ar/Settings/index.html)

          snapshot_settings_actions() {
            local out="$1"
            local cookie="$2"
            local token="$3"

            curl -fsS -b "$cookie" \
              -H "RequestVerificationToken: $token" \
              -X POST \
              --data-urlencode "__RequestVerificationToken=$token" \
              --data-urlencode 'ServerUrl=Demo Server' \
              --data-urlencode 'RepositoryId=TestEmployee' \
              --data-urlencode 'ApiBasePath=/DemoApi' \
              --data-urlencode 'ApiVersion=Demo' \
              --data-urlencode 'RootEntryId=1' \
              --data-urlencode 'TimeoutSeconds=30' \
              'http://127.0.0.1:5055/Settings/TestConnection' \
              -o "$out/Settings/TestConnection.html"

            curl -fsS -b "$cookie" \
              -H "RequestVerificationToken: $token" \
              -X POST \
              --data-urlencode "__RequestVerificationToken=$token" \
              --data-urlencode 'ServerUrl=Demo Server' \
              --data-urlencode 'RepositoryId=TestEmployee' \
              --data-urlencode 'ApiBasePath=/DemoApi' \
              'http://127.0.0.1:5055/Settings/DiscoverRepositories' \
              -o "$out/Settings/DiscoverRepositories.json"
          }

          snapshot_settings_actions '_site' 'en.cookies' "$EN_TOKEN"
          snapshot_settings_actions '_site/ar' 'ar.cookies' "$AR_TOKEN"

          cp -R src/LFPortal.Web/wwwroot/. _site/
          touch _site/.nojekyll

          REPO_NAME="${GITHUB_REPOSITORY#*/}" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path('_site')
          base = '/' + os.environ['REPO_NAME']
          folder_link = re.compile(r'/Archive\?entryId=(10[0-7])(?:&amp;|&)trail=[^"\']*')
          root_archive_link = re.compile(r'/Archive\?entryId=1(?:&amp;|&)[^"\']*')
          culture_link = re.compile(r'href=(["\'])(/SetCulture\?[^"\']*)\1', re.IGNORECASE)
          old_culture_link = re.compile(r'href=(["\'])(/Home/SetLanguage[^"\']*)\1', re.IGNORECASE)
          probe_link = re.compile(r'href=(["\'])/Dashboard/Probe\1', re.IGNORECASE)
          document_action_link = re.compile(r'href=(["\'])/Document/[^"\']*\1', re.IGNORECASE)
          root_href = re.compile(r'href=(["\'])/\1')

          for path in root.rglob('*.html'):
              rel = path.relative_to(root).as_posix()
              is_ar = rel.startswith('ar/')
              logical = rel[3:] if is_ar else rel

              if logical == 'index.html':
                  suffix = ''
              elif logical.endswith('index.html'):
                  suffix = logical[:-len('index.html')]
              else:
                  suffix = logical

              current_prefix = f'{base}/ar' if is_ar else base
              other_prefix = base if is_ar else f'{base}/ar'
              other_url = f'{other_prefix}/{suffix}' if suffix else f'{other_prefix}/'

              text = path.read_text(encoding='utf-8')

              # Remove machine/server wording from the published design copy only.
              text = text.replace('/LFRepositoryAPI', '/DemoApi')
              text = text.replace('LFRepositoryAPI', 'Demo API')
              text = text.replace('LFDSSTS', 'Demo Auth')
              text = text.replace('Laserfiche Desktop Client', 'Demo Client')
              text = text.replace('https://lf-server.corp.local', 'Demo Server')
              text = text.replace('%ProgramData%\\Dashboard\\laserfiche.config.json', 'demo configuration')

              # Language switcher uses two real static snapshots.
              text = culture_link.sub(lambda _m: f'href="{other_url}"', text)
              text = old_culture_link.sub(lambda _m: f'href="{other_url}"', text)

              # Existing Probe page is snapshotted and remains navigable.
              text = probe_link.sub(f'href="{current_prefix}/Dashboard/Probe/"', text)

              # Dashboard is the ASP.NET default route and may render as href="/".
              text = root_href.sub(f'href="{current_prefix}/"', text)

              # Main navigation stays inside the active language snapshot.
              text = text.replace('href="/Dashboard"', f'href="{current_prefix}/"')
              text = text.replace("href='/Dashboard'", f"href='{current_prefix}/'")
              text = text.replace('href="/Archive"', f'href="{current_prefix}/Archive/"')
              text = text.replace("href='/Archive'", f"href='{current_prefix}/Archive/'")
              text = text.replace('href="/Settings"', f'href="{current_prefix}/Settings/"')
              text = text.replace("href='/Settings'", f"href='{current_prefix}/Settings/'")
              text = text.replace('href="/Login"', f'href="{current_prefix}/"')
              text = text.replace("href='/Login'", f"href='{current_prefix}/'")

              # Archive navigation becomes static URLs while keeping the original UI.
              text = root_archive_link.sub(f'{current_prefix}/Archive/', text)
              text = folder_link.sub(lambda m: f'{current_prefix}/Archive/folder-{m.group(1)}/', text)

              # View/Download require a server-side document stream. Keep the exact
              # buttons visible but inert in this design-only site.
              text = document_action_link.sub('href="#"', text)

              # Assets are shared by English and Arabic at the Pages project root.
              text = re.sub(r'(src=["\'])/(?!/)', rf'\1{base}/', text)
              text = re.sub(
                  r'(href=["\'])/(css|js|lib|images|img|fonts|favicon)',
                  rf'\1{base}/\2',
                  text,
                  flags=re.IGNORECASE)

              # Static runtime adapter is inserted before the existing page scripts.
              # It preserves the original Archive and Settings JavaScript behavior,
              # but redirects their fetches to files generated above.
              runtime = f'''
          <script>
          (function () {{
              const staticBase = {current_prefix!r};
              const nativeFetch = window.fetch.bind(window);
              window.fetch = function(input, init) {{
                  const url = typeof input === 'string' ? input : (input && input.url) || '';
                  const detail = url.match(/^\\/Archive\\/Detail\\?entryId=(\\d+)/i);
                  if (detail) {{
                      return nativeFetch(staticBase + '/Archive/Detail/' + detail[1] + '.html', {{ cache: 'no-store' }});
                  }}
                  if (/^\\/Settings\\/TestConnection(?:\\?|$)/i.test(url)) {{
                      return nativeFetch(staticBase + '/Settings/TestConnection.html', {{ cache: 'no-store' }});
                  }}
                  if (/^\\/Settings\\/DiscoverRepositories(?:\\?|$)/i.test(url)) {{
                      return nativeFetch(staticBase + '/Settings/DiscoverRepositories.json', {{ cache: 'no-store' }});
                  }}
                  return nativeFetch(input, init);
              }};

              document.addEventListener('DOMContentLoaded', function () {{
                  const settingsForm = document.getElementById('settings-form');
                  if (settingsForm) {{
                      settingsForm.addEventListener('submit', function (event) {{
                          event.preventDefault();
                          window.location.href = staticBase + '/Settings/saved/';
                      }});
                  }}
              }});
          }})();
          </script>
          '''

              if '<head>' in text:
                  text = text.replace('<head>', '<head>\n' + runtime, 1)

              # Other server-only form actions must never submit to GitHub Pages.
              text = re.sub(r'action=["\'][^"\']*["\']', 'action="#"', text)

              if '/SetCulture?' in text:
                  raise SystemExit(f'Unrewritten culture link in {path}')
              if root_href.search(text):
                  raise SystemExit(f'Unrewritten root Dashboard href in {path}')

              path.write_text(text, encoding='utf-8')
          PY

          # No real machine/Laserfiche endpoint may appear in published output.
          if grep -RniE 'https?://[^"[:space:]]*(LFRepositoryAPI|LFDSSTS|localhost|127\.0\.0\.1)|desktop-k1svi53|C:\\ProgramData' _site; then
            echo 'Static output contains an actual local or Laserfiche endpoint.'
            exit 1
          fi

          # Core page and interaction checks.
          test -f _site/index.html
          test -f _site/ar/index.html
          test -f _site/Archive/index.html
          test -f _site/ar/Archive/index.html
          test -f _site/Dashboard/Probe/index.html
          test -f _site/ar/Dashboard/Probe/index.html
          test -f _site/Settings/index.html
          test -f _site/ar/Settings/index.html
          test -f _site/Settings/saved/index.html
          test -f _site/Settings/TestConnection.html
          test -f _site/Settings/DiscoverRepositories.json

          grep -Fq 'TestEmployee' _site/index.html
          grep -Fq '14 entries' _site/Archive/index.html
          grep -Fq 'API Diagnostic Probe' _site/Dashboard/Probe/index.html
          grep -Fq 'lang="ar"' _site/ar/index.html
          grep -Fq 'dir="rtl"' _site/ar/index.html
          grep -Fq 'Demo Connected' _site/Settings/TestConnection.html
          grep -Fq 'TestEmployee' _site/Settings/DiscoverRepositories.json

          for id in $DOC_IDS; do
            test -s "_site/Archive/Detail/$id.html"
            test -s "_site/ar/Archive/Detail/$id.html"
          done

          ! grep -Rqi '/SetCulture?' _site
          ! grep -Rqi 'LFRepositoryAPI' _site

          # Crawl every generated href/src and fail the build if a GitHub Pages
          # navigation/asset target would be missing. This catches 404s before deploy.
          REPO_NAME="${GITHUB_REPOSITORY#*/}" python3 - <<'PY'
          import os
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          site = Path('_site').resolve()
          base = '/' + os.environ['REPO_NAME']
          errors = []

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      value = attrs.get(key)
                      if value:
                          self.values.append((tag, key, value))

          for html_file in Path('_site').rglob('*.html'):
              parser = Links()
              parser.feed(html_file.read_text(encoding='utf-8'))
              for tag, attr, raw in parser.values:
                  if raw.startswith(('#', 'mailto:', 'tel:', 'javascript:', 'data:')):
                      continue
                  parts = urlsplit(raw)
                  if parts.scheme or parts.netloc:
                      continue
                  path = unquote(parts.path)
                  if not path:
                      continue
                  if path.startswith('/') and not (path == base or path.startswith(base + '/')):
                      errors.append(f'{html_file}: escapes Pages project: {raw}')
                      continue
                  if not path.startswith(base):
                      continue

                  rel = path[len(base):].lstrip('/')
                  target = site / rel
                  if path.endswith('/') or not target.suffix:
                      target = target / 'index.html'
                  if not target.exists():
                      errors.append(f'{html_file}: missing target for {raw} -> {target}')

          if errors:
              print('\n'.join(errors))
              raise SystemExit(f'{len(errors)} broken static links/assets found')
          print('Static link audit passed.')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
